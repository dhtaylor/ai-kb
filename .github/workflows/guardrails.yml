name: guardrails

# Server-side half of the Phase 0 guardrails.
#
# WHY THIS EXISTS: the pre-commit hook is bypassable (--no-verify) and a clone
# that never ran "git config core.hooksPath .githooks" has no hook at all. This
# workflow runs the same checks where a developer cannot skip them.
#
# WHAT IT IS NOT: this is detection, not prevention. GitHub push protection
# REJECTS a push carrying a credential; this lets the push land and then fails
# the run. A real leak therefore still requires rotation AND a history rewrite —
# rotation alone does not erase it from git, and every clone retains it.
# Push protection is now enabled on this public repo. This workflow remains the
# server-side half: it catches what push protection's patterns do not (the
# engine's own patterns, the entropy and PII passes) and runs the regression
# suite. See documents/decisions/0002-*.md

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-secrets --all walks every blob in history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Executable bits
        run: ./scripts/check-exec-bits

      - name: Secret scan (full history + worktree)
        run: ./scripts/check-secrets --all

      - name: Embedded-fact lint
        run: ./scripts/check-embedded-facts

      - name: Tool-scope lint
        run: ./scripts/check-tool-scope

      # The content checks (check-kb, check-scope, check-golden, check-xlinks) have
      # nothing to run against here: the engine holds no knowledge, and kb/ is not in
      # this repository (ADR-0007). What CI can prove is that they still CATCH what
      # they were written to catch — each case below breaks one thing on purpose.
      # The range is every commit the change brings. On a pull request that is base..head, never
      # event.before: after a force-push (a rebase), before is a commit that no longer exists, and
      # the range would not resolve. On a push, an unresolvable or empty before (a force-push, a
      # new branch) falls back to the merge-base with the default branch, so every new commit is
      # still checked rather than only the last one.
      - name: Stamp honesty
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before=$(git merge-base "origin/${{ github.event.repository.default_branch }}" "${{ github.sha }}" 2>/dev/null || true)
              [ -z "$before" ] || [ "$before" = "${{ github.sha }}" ] && before="${{ github.sha }}~1"
            fi
            range="$before..${{ github.sha }}"
          fi
          ./scripts/check-stamps "$range" || exit 1

      # Phase 4 step 6 (§5A "Never automated"): a PR that deletes/renames-away a
      # fact file, removes a CONFLICTED marker, promotes a scope, or touches
      # CONVENTIONS.md / documents/decisions/ is blocked from this required
      # status check unless the PR carries the 'owner-approved' label — read from
      # the event payload, no token needed, none may be added. On a direct push
      # (the admin-bypass path, ADR-0002) this only warns: a push has already
      # landed by the time this runs, so failing the build here would not have
      # stopped it, only hidden that it happened.
      - name: High-blast-radius scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            labels=$(jq -r '[.pull_request.labels[].name] | join(",")' "$GITHUB_EVENT_PATH")
            ./scripts/check-blast "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" --labels "$labels"
          else
            before="${{ github.event.before }}"
            case "$before" in ''|0000000000000000000000000000000000000000) before="${{ github.sha }}~1" ;; esac
            ./scripts/check-blast "$before" "${{ github.sha }}" || \
              echo "::warning::check-blast found high-blast-radius change(s) on a direct push — see the log above"
          fi

      - name: Guardrail regression suite
        run: ./tests/run-checks -v
